---
- name: Install PatchMaster agent on Windows endpoints
  hosts: DTHNHFGFCON0077
  gather_facts: false
  serial: 1

  vars:
    ansible_ssh_transfer_method: sftp
    patchmaster_stage_dir: 'C:\PatchMasterAgentStage'
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/windows"
    patchmaster_install_dir: 'C:\Program Files\PatchMaster'
    patchmaster_task_name: 'EndpointAgentV1'

  tasks:
    # 1. Validate credentials
    - name: Validate PatchMaster credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length > 0
        fail_msg: "Attach the PatchMaster custom credential."
      no_log: true

    # 2. Validate source files on the AWX execution environment
    - name: Check Windows agent package files
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/{{ item }}"
      loop:
        - endpoint-agent.exe
        - config.windows.example.json
        - install-windows.ps1
      delegate_to: localhost
      become: false
      register: package_files

    - name: Stop if a package file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Missing Windows package file: {{ item.item }}"
      loop: "{{ package_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # 3. Create staging directory on Windows
    - name: Create PatchMaster staging directory
      ansible.windows.win_file:
        path: "{{ patchmaster_stage_dir }}"
        state: directory

    # 4. Copy agent package files using SFTP transfer
    - name: Copy Windows agent package files
      ansible.windows.win_copy:
        src: "{{ patchmaster_package_dir }}/{{ item }}"
        dest: "{{ patchmaster_stage_dir }}\\{{ item }}"
      loop:
        - endpoint-agent.exe
        - config.windows.example.json
        - install-windows.ps1

    # 5. Verify staged files
    - name: Verify staged package files
      ansible.windows.win_stat:
        path: "{{ patchmaster_stage_dir }}\\{{ item }}"
      loop:
        - endpoint-agent.exe
        - config.windows.example.json
        - install-windows.ps1
      register: staged_files

    - name: Stop if a staged package file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "File transfer failed: {{ item.item }}"
      loop: "{{ staged_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # 6. Install and configure agent
    - name: Install and configure PatchMaster agent
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'

          $env:PATCHMASTER_API_URL = '{{ patchmaster_api_url }}'
          $env:PATCHMASTER_BOOTSTRAP_TOKEN = '{{ patchmaster_bootstrap_token }}'

          $stageDir = 'C:\PatchMasterAgentStage'
          $installer = Join-Path $stageDir 'install-windows.ps1'

          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "PatchMaster installer not found: $installer"
          }

          Unblock-File -LiteralPath $installer

          & $installer

          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
              throw "PatchMaster installer exited with code $LASTEXITCODE"
          }

          if ($Error.Count -gt 0) {
              # Do not treat historical PowerShell errors as installation failures.
          }
      no_log: true

    # 7. Verify scheduled task
    - name: Verify PatchMaster scheduled task
      ansible.windows.win_powershell:
        script: |
          $task = Get-ScheduledTask `
              -TaskName '{{ patchmaster_task_name }}' `
              -ErrorAction Stop

          [PSCustomObject]@{
              TaskName = $task.TaskName
              State    = $task.State
          }
      register: scheduled_task_check
      changed_when: false

    # 8. Verify agent executable
    - name: Verify PatchMaster agent executable
      ansible.windows.win_stat:
        path: "{{ patchmaster_install_dir }}\\endpoint-agent.exe"
      register: patchmaster_agent_exe
      changed_when: false

    - name: Assert installation completed
      ansible.builtin.assert:
        that:
          - patchmaster_agent_exe.stat.exists
          - scheduled_task_check is succeeded
        fail_msg: >-
          Installation verification failed. Check the installer script,
          scheduled task configuration, and actual installation path.
        success_msg: >-
          PatchMaster agent executable exists and the scheduled task
          was found.

    # 9. Report safe result
    - name: Report PatchMaster installation result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Agent executable: {{ patchmaster_agent_exe.stat.path }}"
          - "Scheduled task: {{ patchmaster_task_name }}"
          - "Installation verification completed."
