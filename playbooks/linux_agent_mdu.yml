
---
- name: Deploy and Enroll PatchMaster Linux Agents
  hosts: DPDYPH1FCMP0049
  become: true
  gather_facts: false

  vars:
    patchmaster_stage_dir: /tmp/patchmaster-agent-stage
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux"

  tasks:

    # 1. Validate credentials

    - name: Validate PatchMaster credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length > 0
        fail_msg: "Attach the PatchMaster custom credential."
      no_log: true

    # 2. Create staging directories

    - name: Create PatchMaster staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ patchmaster_stage_dir }}"
        - "{{ patchmaster_stage_dir }}/deploy"

    # 3. Copy original agent package

    - name: Copy Linux agent binary
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/endpoint-agent-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        owner: root
        group: root
        mode: "0755"

    - name: Copy Linux configuration template
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/config.linux.example.json"
        dest: "{{ patchmaster_stage_dir }}/config.linux.example.json"
        owner: root
        group: root
        mode: "0644"

    - name: Copy original Linux installer
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/install-linux.sh"
        dest: "{{ patchmaster_stage_dir }}/install-linux.sh"
        owner: root
        group: root
        mode: "0750"

    # 4. Verify package files

    - name: Verify staged installation files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        - "{{ patchmaster_stage_dir }}/config.linux.example.json"
        - "{{ patchmaster_stage_dir }}/install-linux.sh"
      register: patchmaster_files

    - name: Validate staged files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required PatchMaster installation file is missing."
      loop: "{{ patchmaster_files.results }}"

    # 5. Run original installer and enrollment

    - name: Install and enroll PatchMaster agent
      ansible.builtin.command:
        argv:
          - ./install-linux.sh
      args:
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_install_result
      no_log: true
      failed_when: false

    # 6. Reload systemd without replacing installer service

    - name: Reload systemd
      ansible.builtin.command: systemctl daemon-reload
      changed_when: false

    - name: Enable PatchMaster service
      ansible.builtin.command:
        argv:
          - systemctl
          - enable
          - endpoint-agent
      register: patchmaster_enable
      changed_when: patchmaster_enable.rc == 0
      failed_when: false

    - name: Start PatchMaster service
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - endpoint-agent
      register: patchmaster_start
      changed_when: patchmaster_start.rc == 0
      failed_when: false

    # 7. Wait for service startup

    - name: Wait for PatchMaster agent
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - endpoint-agent
      register: patchmaster_service
      changed_when: false
      retries: 12
      delay: 5
      until: patchmaster_service.rc == 0
      failed_when: false

    # 8. Collect diagnostic information

    - name: Get service status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - endpoint-agent
          - --no-pager
          - -l
      register: patchmaster_status
      changed_when: false
      failed_when: false

    - name: Get recent agent logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - endpoint-agent
          - -n
          - "40"
          - --no-pager
      register: patchmaster_logs
      changed_when: false
      failed_when: false

    # 9. Check API connectivity

    - name: Check PatchMaster API connectivity
      ansible.builtin.wait_for:
        host: 172.17.6.142
        port: 5000
        timeout: 5
        state: started
      register: patchmaster_api_check
      failed_when: false

    # 10. Display deployment report

    - name: Display PatchMaster deployment report
      ansible.builtin.debug:
        msg:
          - "Endpoint: {{ inventory_hostname }}"
          - "Installer exit code: {{ patchmaster_install_result.rc }}"
          - "Service state: {{ patchmaster_service.stdout | default('unknown') }}"
          - "API reachable: {{ 'YES' if patchmaster_api_check is succeeded else 'NO' }}"
          - "Service status:"
          - "{{ patchmaster_status.stdout | default('Unavailable') }}"
          - "Recent agent logs:"
          - "{{ patchmaster_logs.stdout | default('No logs available') }}"

    # 11. Final validation

    - name: Validate PatchMaster deployment
      ansible.builtin.assert:
        that:
          - patchmaster_install_result.rc == 0
          - patchmaster_service.rc == 0
        fail_msg: >-
          PatchMaster deployment failed on {{ inventory_hostname }}.
          Check installer result and service logs above.
        success_msg: >-
          PatchMaster agent installed and service active on {{ inventory_hostname }}.
