
---
- name: Deploy or Upgrade PatchMaster Linux Agent v2.3
  hosts: DPDYPHGFPCD0548
  become: true
  gather_facts: true
  serial: 1

  vars:
    patchmaster_stage_dir: /tmp/patchmaster-agent-stage
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux-v2"

    patchmaster_binary: /usr/local/bin/endpoint-agent
    patchmaster_config: /etc/endpoint-agent/config.json
    patchmaster_state: /var/lib/endpoint-agent/state.json
    patchmaster_service: endpoint-agent

    patchmaster_api_host: 172.17.6.142
    patchmaster_api_port: 5000

  tasks:

    # ----------------------------------------------------------
    # 1. CHECK PACKAGE FILES ON AWX CONTROLLER
    # ----------------------------------------------------------

    - name: Check v2.3 binary
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/endpoint-agent-v2.3-standard-linux-amd64"
      delegate_to: localhost
      become: false
      register: patchmaster_binary_package

    - name: Check installer
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/install-linux.sh"
      delegate_to: localhost
      become: false
      register: patchmaster_installer_package

    - name: Check config.linux.example.json
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/config.linux.example.json"
      delegate_to: localhost
      become: false
      register: patchmaster_config_example

    - name: Check config.json fallback
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/config.json"
      delegate_to: localhost
      become: false
      register: patchmaster_config_fallback

    - name: Validate required package files
      ansible.builtin.assert:
        that:
          - patchmaster_binary_package.stat.exists
          - patchmaster_binary_package.stat.isreg
          - patchmaster_binary_package.stat.size > 0
          - patchmaster_installer_package.stat.exists
          - patchmaster_installer_package.stat.isreg
          - patchmaster_installer_package.stat.size > 0
          - patchmaster_config_example.stat.exists or patchmaster_config_fallback.stat.exists
        fail_msg: >-
          Package validation failed. Check the v2.3 binary,
          install-linux.sh, and either config.linux.example.json or config.json.

    - name: Select configuration template
      ansible.builtin.set_fact:
        patchmaster_config_template_source: >-
          {{
            patchmaster_package_dir ~ '/config.linux.example.json'
            if patchmaster_config_example.stat.exists
            else patchmaster_package_dir ~ '/config.json'
          }}

    # ----------------------------------------------------------
    # 2. DETECT EXISTING INSTALLATION
    # ----------------------------------------------------------

    - name: Check existing agent binary
      ansible.builtin.stat:
        path: "{{ patchmaster_binary }}"
      register: patchmaster_binary_check

    - name: Check existing configuration
      ansible.builtin.stat:
        path: "{{ patchmaster_config }}"
      register: patchmaster_config_check

    - name: Check existing enrollment state
      ansible.builtin.stat:
        path: "{{ patchmaster_state }}"
      register: patchmaster_state_check

    - name: Detect systemd service load state
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=LoadState
          - --value
          - "{{ patchmaster_service }}"
      register: patchmaster_service_load
      changed_when: false
      failed_when: false

    - name: Locate existing systemd service file
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=FragmentPath
          - --value
          - "{{ patchmaster_service }}"
      register: patchmaster_service_path
      changed_when: false
      failed_when: false

    - name: Check existing systemd service file
      ansible.builtin.stat:
        path: >-
          {{
            patchmaster_service_path.stdout | trim
            if patchmaster_service_path.stdout | trim | length > 0
            else '/nonexistent'
          }}
      register: patchmaster_service_file_check

    - name: Set installation detection facts
      ansible.builtin.set_fact:
        patchmaster_has_binary: "{{ patchmaster_binary_check.stat.exists }}"
        patchmaster_has_config: "{{ patchmaster_config_check.stat.exists }}"
        patchmaster_has_state: "{{ patchmaster_state_check.stat.exists }}"
        patchmaster_has_service: "{{ patchmaster_service_load.stdout | trim == 'loaded' }}"
        patchmaster_has_service_file: "{{ patchmaster_service_file_check.stat.exists }}"

    - name: Determine installation mode
      ansible.builtin.set_fact:
        patchmaster_any_existing: >-
          {{
            patchmaster_has_binary
            or patchmaster_has_config
            or patchmaster_has_state
            or patchmaster_has_service
          }}
        patchmaster_existing_install: >-
          {{
            patchmaster_has_binary
            and patchmaster_has_config
            and patchmaster_has_service
            and patchmaster_has_service_file
          }}

    - name: Display installation detection
      ansible.builtin.debug:
        msg:
          - "Endpoint: {{ inventory_hostname }}"
          - "Binary: {{ patchmaster_has_binary }}"
          - "Configuration: {{ patchmaster_has_config }}"
          - "Enrollment state: {{ patchmaster_has_state }}"
          - "Systemd service: {{ patchmaster_has_service }}"
          - >-
            Selected mode:
            {{
              'UPGRADE'
              if patchmaster_existing_install
              else 'FRESH INSTALL'
              if not patchmaster_any_existing
              else 'INCOMPLETE INSTALLATION'
            }}

    - name: Stop on incomplete installation
      ansible.builtin.assert:
        that:
          - patchmaster_existing_install or not patchmaster_any_existing
        fail_msg: >-
          An incomplete PatchMaster installation was detected.
          No files have been replaced. Inspect the endpoint before continuing.

    # ----------------------------------------------------------
    # 3. VALIDATE CREDENTIALS FOR FRESH INSTALL ONLY
    # ----------------------------------------------------------

    - name: Validate fresh-install credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length == 44
        fail_msg: >-
          Fresh installation requires patchmaster_api_url and a
          44-character patchmaster_bootstrap_token from AWX credentials.
      no_log: true
      when: not patchmaster_existing_install

    # ----------------------------------------------------------
    # 4. CREATE STAGING DIRECTORIES
    # ----------------------------------------------------------

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ patchmaster_stage_dir }}"
        - "{{ patchmaster_stage_dir }}/deploy"

    # ----------------------------------------------------------
    # 5. STAGE V2.3 BINARY
    # ----------------------------------------------------------

    - name: Copy v2.3 binary to staging
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/endpoint-agent-v2.3-standard-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        owner: root
        group: root
        mode: "0755"

    # ----------------------------------------------------------
    # 6. STAGE CONFIGURATION TEMPLATE
    # ----------------------------------------------------------

    - name: Copy configuration template to staging
      ansible.builtin.copy:
        src: "{{ patchmaster_config_template_source }}"
        dest: "{{ patchmaster_stage_dir }}/config.linux.example.json"
        owner: root
        group: root
        mode: "0644"

    # ----------------------------------------------------------
    # 7. STAGE INSTALLER
    # ----------------------------------------------------------

    - name: Copy installer to staging
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/install-linux.sh"
        dest: "{{ patchmaster_stage_dir }}/install-linux.sh"
        owner: root
        group: root
        mode: "0750"

    # ----------------------------------------------------------
    # 8. CREATE SERVICE TEMPLATE FOR FRESH INSTALL
    # ----------------------------------------------------------

    - name: Create PatchMaster systemd service file
      ansible.builtin.copy:
        dest: "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=PatchMaster Endpoint Agent
          After=network-online.target
          Wants=network-online.target
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/var/lib/endpoint-agent
          ExecStart=/usr/local/bin/endpoint-agent
          Restart=always
          RestartSec=10
          KillSignal=SIGTERM
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
      when: not patchmaster_existing_install

    # ----------------------------------------------------------
    # 9. VERIFY STAGED FILES
    # ----------------------------------------------------------

    - name: Check staged files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        - "{{ patchmaster_stage_dir }}/config.linux.example.json"
        - "{{ patchmaster_stage_dir }}/install-linux.sh"
      register: patchmaster_staged_files

    - name: Validate staged files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "A required staged PatchMaster file is missing or empty."
      loop: "{{ patchmaster_staged_files.results }}"

    - name: Verify staged service file for fresh installation
      ansible.builtin.stat:
        path: "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
      register: patchmaster_staged_service
      when: not patchmaster_existing_install

    - name: Validate staged service file
      ansible.builtin.assert:
        that:
          - patchmaster_staged_service.stat.exists
          - patchmaster_staged_service.stat.size > 0
        fail_msg: "PatchMaster systemd service file is missing."
      when: not patchmaster_existing_install

    # ----------------------------------------------------------
    # 10. CHECK API CONNECTIVITY FOR FRESH INSTALL
    # ----------------------------------------------------------

    - name: Check PatchMaster API connectivity
      ansible.builtin.wait_for:
        host: "{{ patchmaster_api_host }}"
        port: "{{ patchmaster_api_port }}"
        timeout: 15
        state: started
      when: not patchmaster_existing_install

    # ----------------------------------------------------------
    # 11. FRESH INSTALLATION
    # ----------------------------------------------------------

    - name: Install PatchMaster agent for the first time
      ansible.builtin.command:
        argv:
          - ./install-linux.sh
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_fresh_install
      no_log: true
      when: not patchmaster_existing_install

    # ----------------------------------------------------------
    # 12. UPGRADE EXISTING INSTALLATION
    # ----------------------------------------------------------

    - name: Stop existing PatchMaster service
      ansible.builtin.systemd_service:
        name: "{{ patchmaster_service }}"
        state: stopped
      when: patchmaster_existing_install

    - name: Back up existing agent binary
      ansible.builtin.copy:
        src: "{{ patchmaster_binary }}"
        dest: "{{ patchmaster_binary }}.pre-v2.3"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: patchmaster_existing_install

    - name: Replace existing agent binary with v2.3
      ansible.builtin.copy:
        src: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        dest: "{{ patchmaster_binary }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: patchmaster_existing_install

    - name: Verify existing configuration is preserved
      ansible.builtin.stat:
        path: "{{ patchmaster_config }}"
      register: patchmaster_config_after_upgrade
      when: patchmaster_existing_install

    - name: Verify existing enrollment state is preserved
      ansible.builtin.stat:
        path: "{{ patchmaster_state }}"
      register: patchmaster_state_after_upgrade
      when:
        - patchmaster_existing_install
        - patchmaster_state_check.stat.exists

    - name: Validate preserved configuration
      ansible.builtin.assert:
        that:
          - patchmaster_config_after_upgrade.stat.exists
        fail_msg: "Existing agent configuration was not preserved."
      when: patchmaster_existing_install

    - name: Validate preserved enrollment state
      ansible.builtin.assert:
        that:
          - patchmaster_state_after_upgrade.stat.exists
        fail_msg: "Existing enrollment state was not preserved."
      when:
        - patchmaster_existing_install
        - patchmaster_state_check.stat.exists

    # ----------------------------------------------------------
    # 13. RELOAD SYSTEMD
    # ----------------------------------------------------------

    - name: Reload systemd configuration
      ansible.builtin.systemd_service:
        daemon_reload: true

    # ----------------------------------------------------------
    # 14. ENABLE AND RESTART AGENT
    # ----------------------------------------------------------

    - name: Enable and restart PatchMaster agent
      ansible.builtin.systemd_service:
        name: "{{ patchmaster_service }}"
        enabled: true
        state: restarted

    # ----------------------------------------------------------
    # 15. VERIFY SERVICE
    # ----------------------------------------------------------

    - name: Wait for active PatchMaster service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ patchmaster_service }}"
      register: patchmaster_active
      changed_when: false
      retries: 12
      delay: 5
      until: patchmaster_active.rc == 0

    # ----------------------------------------------------------
    # 16. GET INSTALLED VERSION
    # ----------------------------------------------------------

    - name: Get installed PatchMaster agent version
      ansible.builtin.command:
        argv:
          - "{{ patchmaster_binary }}"
          - -version
      register: patchmaster_version
      changed_when: false
      failed_when: false

    # ----------------------------------------------------------
    # 17. COLLECT RECENT LOGS
    # ----------------------------------------------------------

    - name: Collect recent PatchMaster agent logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - "{{ patchmaster_service }}"
          - -n
          - "50"
          - --no-pager
      register: patchmaster_logs
      changed_when: false
      failed_when: false

    # ----------------------------------------------------------
    # 18. FINAL REPORT
    # ----------------------------------------------------------

    - name: Display PatchMaster deployment report
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "PATCHMASTER DEPLOYMENT REPORT"
          - "========================================"
          - "Endpoint: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution | default('Linux') }}"
          - "Installation mode: {{ 'UPGRADE' if patchmaster_existing_install else 'FRESH INSTALL' }}"
          - "Target version: v2.3"
          - "Agent version: {{ patchmaster_version.stdout | default('Unavailable') }}"
          - "Service status: {{ patchmaster_active.stdout | default('Unknown') }}"
          - "Configuration: {{ 'PRESERVED' if patchmaster_existing_install else 'CREATED' }}"
          - "Enrollment state: {{ 'PRESERVED' if patchmaster_existing_install else 'FRESH ENROLLMENT REQUESTED' }}"
          - "========================================"
          - "RECENT AGENT LOGS"
          - "{{ patchmaster_logs.stdout | default('Unavailable') }}"
          - "========================================"

    # ----------------------------------------------------------
    # 19. FINAL VALIDATION
    # ----------------------------------------------------------

    - name: Validate PatchMaster deployment
      ansible.builtin.assert:
        that:
          - patchmaster_active.rc == 0
          - patchmaster_version.rc == 0
          - >-
            patchmaster_existing_install
            or (patchmaster_fresh_install.rc | default(1)) == 0
        success_msg: >-
          PatchMaster v2.3 deployment completed.
          Mode: {{ 'UPGRADE' if patchmaster_existing_install else 'FRESH INSTALL' }}
        fail_msg: >-
          PatchMaster deployment validation failed.
          Review the agent service status and journal logs.
