
---
- name: Deploy and Enroll PatchMaster Linux Agent
  hosts: DPDYPH1FCMP0049
  become: true
  gather_facts: false

  vars:
    patchmaster_stage_dir: /tmp/patchmaster-agent-stage
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux-v2"

  tasks:

    # 1. Validate AWX credentials

    - name: Validate PatchMaster credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length == 44
        fail_msg: >-
          PatchMaster credentials are missing or the bootstrap token
          is not the expected 44 characters.
      no_log: true

    # 2. Create staging directories

    - name: Create PatchMaster staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ patchmaster_stage_dir }}"
        - "{{ patchmaster_stage_dir }}/deploy"

    # 3. Copy agent binary

    - name: Copy Linux agent binary
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/endpoint-agent-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        owner: root
        group: root
        mode: "0755"

    # 4. Copy configuration template

    - name: Copy Linux configuration template
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/config.linux.example.json"
        dest: "{{ patchmaster_stage_dir }}/config.linux.example.json"
        owner: root
        group: root
        mode: "0644"

    # 5. Copy original installer

    - name: Copy Linux installer
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/install-linux.sh"
        dest: "{{ patchmaster_stage_dir }}/install-linux.sh"
        owner: root
        group: root
        mode: "0750"

    # 6. IMPORTANT: Copy systemd service file
    # The original installer requires ./deploy/endpoint-agent.service

    - name: Copy PatchMaster systemd service file
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/deploy/endpoint-agent.service"
        dest: "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
        owner: root
        group: root
        mode: "0644"

    # 7. Verify all package files

    - name: Verify staged installation files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        - "{{ patchmaster_stage_dir }}/config.linux.example.json"
        - "{{ patchmaster_stage_dir }}/install-linux.sh"
        - "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
      register: patchmaster_files

    - name: Validate staged package
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "A required PatchMaster package file is missing or empty."
      loop: "{{ patchmaster_files.results }}"

    # 8. Execute original installer
    # Do not hide installer failures.

    - name: Install and enroll PatchMaster agent
      ansible.builtin.command:
        argv:
          - ./install-linux.sh
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_install_result
      no_log: true

    # 9. Verify endpoint configuration contains exactly the AWX token

    - name: Verify installed PatchMaster configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import os
            import sys

            path = "/etc/endpoint-agent/config.json"

            with open(path, encoding="utf-8") as f:
                config = json.load(f)

            expected = os.environ["EXPECTED_BOOTSTRAP_TOKEN"]
            actual = config.get("bootstrap_token", "")

            if actual != expected:
                print("TOKEN_MISMATCH")
                sys.exit(1)

            if config.get("api_base_url") != os.environ["EXPECTED_API_URL"]:
                print("API_URL_MISMATCH")
                sys.exit(1)

            print("CONFIG_MATCH")
      environment:
        EXPECTED_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
        EXPECTED_API_URL: "{{ patchmaster_api_url }}"
      register: patchmaster_config_check
      changed_when: false
      no_log: true

    - name: Confirm endpoint configuration
      ansible.builtin.assert:
        that:
          - patchmaster_config_check.rc == 0
        fail_msg: >-
          The endpoint configuration does not match the AWX deployment
          credentials. Agent startup has been stopped.

    # 10. Reload and start service

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and start PatchMaster agent
      ansible.builtin.systemd_service:
        name: endpoint-agent
        enabled: true
        state: started

    # 11. Wait for service

    - name: Wait for PatchMaster agent service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - endpoint-agent
      register: patchmaster_service
      changed_when: false
      retries: 12
      delay: 5
      until: patchmaster_service.rc == 0

    # 12. Check API connectivity

    - name: Check PatchMaster API connectivity
      ansible.builtin.wait_for:
        host: 172.17.6.142
        port: 5000
        timeout: 10
        state: started

    # 13. Collect agent logs

    - name: Get recent PatchMaster agent logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - endpoint-agent
          - -n
          - "50"
          - --no-pager
      register: patchmaster_logs
      changed_when: false
      failed_when: false

    # 14. Final report

    - name: Display PatchMaster deployment report
      ansible.builtin.debug:
        msg:
          - "Endpoint: {{ inventory_hostname }}"
          - "Installer: SUCCESS"
          - "AWX token and endpoint configuration: MATCH"
          - "Agent service: {{ patchmaster_service.stdout }}"
          - "Recent agent logs:"
          - "{{ patchmaster_logs.stdout | default('No logs available') }}"
