
---
- name: Deploy and Enroll PatchMaster Linux Agent
  hosts: DPDYPH1FCMP0049, DPDYPH1FMIC0706, DPDYPH1FQAC0072, DPDYPH1FVCC0585, DPDYPH1FVCD0578, DPDYPH1FVCD0584, DPDYPHGCAL0608, DPDYPHGFCAL0609, DPDYPHGFPCD0548
  become: true
  gather_facts: false

  vars:
    patchmaster_stage_dir: /tmp/patchmaster-agent-stage
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux-v2"

  tasks:

    # 1. Validate AWX credentials

    - name: Validate PatchMaster credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length == 44
        fail_msg: "Invalid PatchMaster AWX credentials."
      no_log: true

    # 2. Validate package files on AWX controller

    - name: Check Linux v2.3 package
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop:
        - endpoint-agent-v2.3-standard-linux-amd64
        - config.linux.example.json
        - install-linux.sh
      register: patchmaster_package_files

    - name: Validate Linux v2.3 package
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "Missing package file: {{ item.item }}"
      loop: "{{ patchmaster_package_files.results }}"

    # 3. Locate existing systemd service on endpoint

    - name: Locate existing PatchMaster service
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=FragmentPath
          - --value
          - endpoint-agent
      register: patchmaster_service_file
      changed_when: false

    - name: Verify existing service file
      ansible.builtin.stat:
        path: "{{ patchmaster_service_file.stdout }}"
      register: patchmaster_existing_service

    - name: Require existing service file
      ansible.builtin.assert:
        that:
          - patchmaster_existing_service.stat.exists
          - patchmaster_existing_service.stat.isreg
        fail_msg: >-
          Existing endpoint-agent systemd service was not found.
          No replacement service will be invented.

    # 4. Create staging directories

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ patchmaster_stage_dir }}"
        - "{{ patchmaster_stage_dir }}/deploy"

    # 5. Copy v2.3 binary using original installer filename

    - name: Copy PatchMaster v2.3 binary
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/endpoint-agent-v2.3-standard-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        owner: root
        group: root
        mode: "0755"

    # 6. Copy configuration template

    - name: Copy Linux configuration template
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/config.linux.example.json"
        dest: "{{ patchmaster_stage_dir }}/config.linux.example.json"
        owner: root
        group: root
        mode: "0644"

    # 7. Copy original installer

    - name: Copy original installer
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/install-linux.sh"
        dest: "{{ patchmaster_stage_dir }}/install-linux.sh"
        owner: root
        group: root
        mode: "0750"

    # 8. Reuse existing endpoint service definition

    - name: Copy existing systemd service into staging
      ansible.builtin.copy:
        src: "{{ patchmaster_service_file.stdout }}"
        dest: "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    # 9. Verify staged binary and service

    - name: Verify staged files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        - "{{ patchmaster_stage_dir }}/config.linux.example.json"
        - "{{ patchmaster_stage_dir }}/install-linux.sh"
        - "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
      register: patchmaster_staged

    - name: Validate staged files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "Staging failed for a required PatchMaster file."
      loop: "{{ patchmaster_staged.results }}"

    # 10. Check API connectivity

    - name: Check PatchMaster API
      ansible.builtin.wait_for:
        host: 172.17.6.142
        port: 5000
        timeout: 10
        state: started

    # 11. Run original installer

    - name: Install and enroll PatchMaster agent
      ansible.builtin.command:
        argv:
          - ./install-linux.sh
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_install
      no_log: true

    # 12. Verify installed configuration without exposing token

    - name: Verify installed configuration
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, sys

            with open("/etc/endpoint-agent/config.json") as f:
                config = json.load(f)

            expected = os.environ["EXPECTED_TOKEN"]
            actual = config.get("bootstrap_token", "")

            if actual != expected:
                print("TOKEN_MISMATCH")
                sys.exit(1)

            if config.get("api_base_url") != os.environ["EXPECTED_API"]:
                print("API_URL_MISMATCH")
                sys.exit(1)

            print("CONFIG_MATCH")
      environment:
        EXPECTED_TOKEN: "{{ patchmaster_bootstrap_token }}"
        EXPECTED_API: "{{ patchmaster_api_url }}"
      register: patchmaster_config
      changed_when: false
      no_log: true

    - name: Validate configuration
      ansible.builtin.assert:
        that:
          - patchmaster_config.rc == 0
        fail_msg: "Endpoint configuration does not match AWX credentials."

    # 13. Reload and start service

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Enable and start agent
      ansible.builtin.systemd_service:
        name: endpoint-agent
        enabled: true
        state: restarted

    # 14. Verify service

    - name: Wait for active service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - endpoint-agent
      register: patchmaster_active
      changed_when: false
      retries: 12
      delay: 5
      until: patchmaster_active.rc == 0

    # 15. Get installed version

    - name: Get PatchMaster version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/endpoint-agent
          - -version
      register: patchmaster_version
      changed_when: false
      failed_when: false

    # 16. Collect enrollment logs

    - name: Get recent PatchMaster logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - endpoint-agent
          - -n
          - "50"
          - --no-pager
      register: patchmaster_logs
      changed_when: false
      failed_when: false

    # 17. Deployment report

    - name: Display PatchMaster deployment report
      ansible.builtin.debug:
        msg:
          - "Endpoint: {{ inventory_hostname }}"
          - "Installer: SUCCESS"
          - "Configuration: MATCH"
          - "Agent Version: {{ patchmaster_version.stdout | default('Unavailable') }}"
          - "Service: {{ patchmaster_active.stdout }}"
          - "Recent logs:"
          - "{{ patchmaster_logs.stdout | default('Unavailable') }}"

    # 18. Final validation

    - name: Validate deployment
      ansible.builtin.assert:
        that:
          - patchmaster_install.rc == 0
          - patchmaster_config.rc == 0
          - patchmaster_active.rc == 0
        success_msg: "PatchMaster deployment completed successfully."
