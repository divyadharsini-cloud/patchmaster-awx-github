
---
- name: Deploy and Enroll PatchMaster Linux Agents
  hosts: DPDYPH1FCMP0049
  become: true
  gather_facts: false

  vars:
    patchmaster_stage_dir: /tmp/patchmaster-agent-stage
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux-v2"
    patchmaster_api_host: "172.17.6.142"
    patchmaster_api_port: 5000

  tasks:

    # 1. Validate AWX credentials

    - name: Validate PatchMaster credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length == 44
        fail_msg: >-
          PatchMaster API URL or bootstrap credential is missing.
          Expected bootstrap token length is 44.
      no_log: true

    # 2. Validate package files on AWX controller

    - name: Check PatchMaster package files
      ansible.builtin.stat:
        path: "{{ patchmaster_package_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop:
        - endpoint-agent-linux-amd64
        - config.linux.example.json
        - install-linux.sh
        - deploy/endpoint-agent.service
      register: patchmaster_package_validation

    - name: Validate PatchMaster package
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: >-
          Missing or empty package file:
          {{ item.item }}
          Expected directory: {{ patchmaster_package_dir }}
      loop: "{{ patchmaster_package_validation.results }}"

    # 3. Create staging directories

    - name: Create PatchMaster staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ patchmaster_stage_dir }}"
        - "{{ patchmaster_stage_dir }}/deploy"

    # 4. Copy Linux agent binary

    - name: Copy Linux agent binary
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/endpoint-agent-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        owner: root
        group: root
        mode: "0755"

    # 5. Copy configuration template

    - name: Copy Linux configuration template
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/config.linux.example.json"
        dest: "{{ patchmaster_stage_dir }}/config.linux.example.json"
        owner: root
        group: root
        mode: "0644"

    # 6. Copy original installer

    - name: Copy original Linux installer
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/install-linux.sh"
        dest: "{{ patchmaster_stage_dir }}/install-linux.sh"
        owner: root
        group: root
        mode: "0750"

    # 7. Copy original systemd service

    - name: Copy PatchMaster systemd service
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/deploy/endpoint-agent.service"
        dest: "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
        owner: root
        group: root
        mode: "0644"

    # 8. Verify staged files

    - name: Verify staged installation files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_stage_dir }}/endpoint-agent-linux-amd64"
        - "{{ patchmaster_stage_dir }}/config.linux.example.json"
        - "{{ patchmaster_stage_dir }}/install-linux.sh"
        - "{{ patchmaster_stage_dir }}/deploy/endpoint-agent.service"
      register: patchmaster_staged_files

    - name: Validate staged installation files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.size > 0
        fail_msg: "Staged PatchMaster installation file is missing."
      loop: "{{ patchmaster_staged_files.results }}"

    # 9. Check API connectivity before installation

    - name: Check PatchMaster API connectivity
      ansible.builtin.wait_for:
        host: "{{ patchmaster_api_host }}"
        port: "{{ patchmaster_api_port }}"
        timeout: 10
        state: started

    # 10. Execute original installer

    - name: Install and enroll PatchMaster agent
      ansible.builtin.command:
        argv:
          - ./install-linux.sh
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_install_result
      no_log: true

    # 11. Verify installed configuration against AWX credential

    - name: Verify installed bootstrap credential
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import os
            import sys

            path = "/etc/endpoint-agent/config.json"

            with open(path, encoding="utf-8") as f:
                config = json.load(f)

            expected = os.environ["EXPECTED_BOOTSTRAP_TOKEN"]
            actual = config.get("bootstrap_token", "")

            if actual != expected:
                print("TOKEN_MISMATCH")
                sys.exit(1)

            if config.get("api_base_url") != os.environ["EXPECTED_API_URL"]:
                print("API_URL_MISMATCH")
                sys.exit(1)

            print("CONFIG_MATCH")
      environment:
        EXPECTED_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
        EXPECTED_API_URL: "{{ patchmaster_api_url }}"
      register: patchmaster_config_check
      changed_when: false
      no_log: true

    - name: Validate installed configuration
      ansible.builtin.assert:
        that:
          - patchmaster_config_check.rc == 0
        fail_msg: >-
          Installed configuration does not match AWX credentials.
          Check installer and credential delivery.

    # 12. Reload systemd

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    # 13. Enable and start agent

    - name: Enable and start PatchMaster agent
      ansible.builtin.systemd_service:
        name: endpoint-agent
        enabled: true
        state: started

    # 14. Wait for agent service

    - name: Wait for PatchMaster agent service
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - endpoint-agent
      register: patchmaster_service
      changed_when: false
      retries: 12
      delay: 5
      until: patchmaster_service.rc == 0

    # 15. Get agent version

    - name: Get PatchMaster agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/endpoint-agent
          - -version
      register: patchmaster_version
      changed_when: false
      failed_when: false

    # 16. Collect service status

    - name: Get PatchMaster service status
      ansible.builtin.command:
        argv:
          - systemctl
          - status
          - endpoint-agent
          - --no-pager
          - -l
      register: patchmaster_status
      changed_when: false
      failed_when: false

    # 17. Collect recent logs

    - name: Get recent PatchMaster agent logs
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - endpoint-agent
          - -n
          - "50"
          - --no-pager
      register: patchmaster_logs
      changed_when: false
      failed_when: false

    # 18. Final deployment report

    - name: Display PatchMaster deployment report
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "PATCHMASTER LINUX DEPLOYMENT REPORT"
          - "========================================"
          - "Endpoint: {{ inventory_hostname }}"
          - "Installer: SUCCESS"
          - "Configuration: MATCH"
          - "Agent Version: {{ patchmaster_version.stdout | default('Unavailable') }}"
          - "Service State: {{ patchmaster_service.stdout | default('unknown') }}"
          - "========================================"
          - "SERVICE STATUS"
          - "{{ patchmaster_status.stdout | default('Unavailable') }}"
          - "========================================"
          - "RECENT AGENT LOGS"
          - "{{ patchmaster_logs.stdout | default('No logs available') }}"

    # 19. Final validation

    - name: Validate PatchMaster deployment
      ansible.builtin.assert:
        that:
          - patchmaster_install_result.rc == 0
          - patchmaster_config_check.rc == 0
          - patchmaster_service.rc == 0
        success_msg: >-
          PatchMaster agent installation and service validation
          succeeded on {{ inventory_hostname }}.
        fail_msg: >-
          PatchMaster deployment validation failed on
          {{ inventory_hostname }}. Review the service logs.
