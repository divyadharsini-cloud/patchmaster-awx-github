
---
- name: Repair and verify PatchMaster Linux endpoint agent
  hosts: TTHNPHGFU010075
  become: true
  gather_facts: false
  serial: 1

  vars:
    agent_service: endpoint-agent
    agent_config: /etc/endpoint-agent/config.json
    agent_state: /var/lib/endpoint-agent/state.json
    agent_env: /etc/endpoint-agent/agent.env
    agent_log: /var/log/endpoint-agent/agent.log
    agent_binary: /usr/local/bin/endpoint-agent
    agent_api: http://172.17.6.142:5000

  tasks:
    - name: Check required core agent files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ agent_binary }}"
        - "{{ agent_config }}"
        - "{{ agent_state }}"
      register: required_files

    - name: Stop if a required core file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Required core file is missing: {{ item.item }}"
      loop: "{{ required_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read configured token environment variable
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            with open("{{ agent_config }}") as f:
                config = json.load(f)
            print(config.get("token_env", "ENDPOINT_AGENT_TOKEN"))
      register: token_env_name
      changed_when: false

    - name: Read existing state token securely
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            with open("{{ agent_state }}") as f:
                state = json.load(f)
            token = state.get("token", "")
            if not token:
                raise SystemExit("Existing state token is missing")
            print(token)
      register: state_token
      changed_when: false
      no_log: true

    - name: Create environment directory
      ansible.builtin.file:
        path: /etc/endpoint-agent
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check whether environment file exists
      ansible.builtin.stat:
        path: "{{ agent_env }}"
      register: env_file_stat

    - name: Restore environment file from existing state token if missing
      ansible.builtin.copy:
        dest: "{{ agent_env }}"
        content: "{{ token_env_name.stdout }}={{ state_token.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not env_file_stat.stat.exists
      no_log: true

    - name: Ensure environment file has secure permissions
      ansible.builtin.file:
        path: "{{ agent_env }}"
        owner: root
        group: root
        mode: "0600"

    - name: Validate state token matches environment token
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        import os
        import sys

        with open("{{ agent_config }}") as f:
            config = json.load(f)
        with open("{{ agent_state }}") as f:
            state = json.load(f)

        name = config.get("token_env", "ENDPOINT_AGENT_TOKEN")
        expected = state.get("token", "")
        actual = ""

        with open("{{ agent_env }}") as f:
            for line in f:
                if line.startswith(name + "="):
                    actual = line.rstrip("\r\n").split("=", 1)[1]
                    break

        if not expected or expected != actual:
            print("FAIL: State token and environment token do not match")
            sys.exit(1)

        print("PASS: Existing state token matches environment token")
        PY
      args:
        executable: /bin/bash
      register: token_validation
      changed_when: false
      no_log: true

    - name: Stop if token validation fails
      ansible.builtin.assert:
        that:
          - token_validation.rc == 0
        fail_msg: >-
          Token validation failed. The service was not restarted.
          Check the existing state and environment file.

    - name: Ensure systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/endpoint-agent.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure systemd environment file
      ansible.builtin.copy:
        dest: /etc/systemd/system/endpoint-agent.service.d/10-agent-env.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile={{ agent_env }}

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart and enable endpoint agent
      ansible.builtin.systemd:
        name: "{{ agent_service }}"
        state: restarted
        enabled: true

    - name: Wait for agent to start
      ansible.builtin.pause:
        seconds: 5

    - name: Check service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ agent_service }}"
      register: service_status
      changed_when: false
      failed_when: false

    - name: Verify token is present in running process
      ansible.builtin.shell: |
        set -o pipefail
        PID=$(systemctl show "{{ agent_service }}" -p MainPID --value)
        test "$PID" -gt 0 &&
        tr '\000' '\n' < "/proc/$PID/environ" |
          grep -Fq "{{ token_env_name.stdout }}="
      args:
        executable: /bin/bash
      register: process_token_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Read recent agent log
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "40"
          - "{{ agent_log }}"
      register: agent_log_tail
      changed_when: false
      failed_when: false

    - name: Display safe diagnostic summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Service status: {{ service_status.stdout | default('unknown') }}"
          - "Token present in process: {{ process_token_check.rc == 0 }}"
          - "Recent agent log readable: {{ agent_log_tail.rc == 0 }}"
          - "Verify fresh dashboard Last Seen and configuration application."

    - name: Fail if service or process token check fails
      ansible.builtin.assert:
        that:
          - service_status.stdout == "active"
          - process_token_check.rc == 0
        fail_msg: >-
          Agent verification failed. Review the service journal and agent log.
