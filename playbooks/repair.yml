
---
- name: Repair and verify PatchMaster Linux endpoint agent
  hosts: TTHNPH1FU010084
  become: true
  gather_facts: false
  serial: 1

  vars:
    agent_service: endpoint-agent
    agent_config: /etc/endpoint-agent/config.json
    agent_state: /var/lib/endpoint-agent/state.json
    agent_env: /etc/endpoint-agent/agent.env
    agent_log: /var/log/endpoint-agent/agent.log
    agent_binary: /usr/local/bin/endpoint-agent
    agent_api: http://172.17.6.142:5000

  tasks:
    - name: Confirm required agent files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ agent_binary }}"
        - "{{ agent_config }}"
        - "{{ agent_state }}"
        - "{{ agent_env }}"
      register: agent_files

    - name: Stop if a required file is missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Required agent file is missing: {{ item.item }}"
      loop: "{{ agent_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Validate existing token and configuration without displaying secrets
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, os, sys

        config_path = "{{ agent_config }}"
        state_path = "{{ agent_state }}"
        env_path = "{{ agent_env }}"

        with open(config_path) as f:
            config = json.load(f)
        with open(state_path) as f:
            state = json.load(f)

        token_env = config.get("token_env", "ENDPOINT_AGENT_TOKEN")
        state_token = state.get("token", "")

        env_token = ""
        with open(env_path) as f:
            for line in f:
                if line.startswith(token_env + "="):
                    env_token = line.rstrip("\r\n").split("=", 1)[1]
                    break

        if not state_token:
            print("FAIL: Existing state has no token")
            sys.exit(2)

        if state_token != env_token:
            print("FAIL: State token and environment token do not match")
            sys.exit(3)

        print("PASS: Existing token matches the environment")
        print("PASS: Configured token environment variable:", token_env)
        print("PASS: API URL configured:", config.get("api_base_url", "missing"))
        PY
      args:
        executable: /bin/bash
      register: token_validation
      changed_when: false
      no_log: false

    - name: Stop if token validation failed
      ansible.builtin.assert:
        that:
          - token_validation.rc == 0
        fail_msg: "Token validation failed. Existing token and state were preserved."

    - name: Restrict environment file permissions
      ansible.builtin.file:
        path: "{{ agent_env }}"
        owner: root
        group: root
        mode: "0600"

    - name: Ensure systemd loads the existing environment file
      ansible.builtin.file:
        path: /etc/systemd/system/endpoint-agent.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure systemd environment file
      ansible.builtin.copy:
        dest: /etc/systemd/system/endpoint-agent.service.d/10-agent-env.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile={{ agent_env }}
      register: systemd_dropin

    - name: Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart the endpoint agent
      ansible.builtin.systemd:
        name: "{{ agent_service }}"
        state: restarted
        enabled: true

    - name: Wait for agent service to settle
      ansible.builtin.pause:
        seconds: 5

    - name: Read agent service status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ agent_service }}"
      register: service_status
      changed_when: false
      failed_when: false

    - name: Check token presence in the running process without exposing it
      ansible.builtin.shell: |
        set -o pipefail
        PID=$(systemctl show "{{ agent_service }}" -p MainPID --value)
        test "$PID" -gt 0 &&
        tr '\000' '\n' < "/proc/$PID/environ" |
          grep -q '^ENDPOINT_AGENT_TOKEN=.'
      args:
        executable: /bin/bash
      register: process_token_check
      changed_when: false
      failed_when: false

    - name: Check API endpoint reachability
      ansible.builtin.uri:
        url: "{{ agent_api }}/"
        method: GET
        return_content: false
        status_code: [200, 401, 403, 404]
        timeout: 5
      register: api_check
      failed_when: false
      changed_when: false

    - name: Read recent agent log
      ansible.builtin.command:
        argv:
          - tail
          - -n
          - "40"
          - "{{ agent_log }}"
      register: agent_log_tail
      changed_when: false
      failed_when: false

    - name: Show safe diagnostic summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Service status: {{ service_status.stdout | default('unknown') }}"
          - "Token present in running process: {{ process_token_check.rc == 0 }}"
          - "API HTTP status: {{ api_check.status | default('unavailable') }}"
          - "Recent agent log available: {{ agent_log_tail.rc == 0 }}"
          - "Review recent agent log on the host if check-in or configuration application is not confirmed."

    - name: Fail if service or process environment is incorrect
      ansible.builtin.assert:
        that:
          - service_status.stdout == "active"
          - process_token_check.rc == 0
        fail_msg: >-
          Agent service or token environment validation failed.
          Review the service journal and agent log before further changes.
