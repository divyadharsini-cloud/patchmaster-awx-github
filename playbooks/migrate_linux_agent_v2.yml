
---
- name: Migrate PatchMaster Linux Agent V1 to V2 safely
  hosts: ansibletesting
  become: true
  gather_facts: true
  serial: 1

  vars:
    # AWX custom credential variables
    # patchmaster_api_url
    # patchmaster_bootstrap_token

    patchmaster_stage_dir: /tmp/patchmaster-agent-v2-stage

    # Linux V2 package on AWX
    patchmaster_package_dir: "{{ playbook_dir }}/../files/patchmaster-agent/linux-v2"

    # V1 installation
    patchmaster_v1_service: endpoint-agent
    patchmaster_v1_binary: /usr/local/bin/endpoint-agent
    patchmaster_v1_config: /etc/endpoint-agent/config.json
    patchmaster_v1_state: /var/lib/endpoint-agent/state.json
    patchmaster_v1_unit: /etc/systemd/system/endpoint-agent.service

    # V2 installation
    patchmaster_v2_service: endpoint-agent-v2
    patchmaster_v2_binary: /usr/local/bin/endpoint-agent-v2
    patchmaster_v2_unit: /etc/systemd/system/endpoint-agent-v2.service
    patchmaster_v2_state: /var/lib/endpoint-agent/state.json
    patchmaster_v2_config: /etc/endpoint-agent/config.json

    # Backup directory
    patchmaster_backup_dir: >-
      /var/backups/patchmaster-migration-{{ ansible_date_time.iso8601_basic_short }}

  tasks:

    # =========================================================
    # 1. VALIDATE AWX CREDENTIALS
    # =========================================================

    - name: Validate PatchMaster API credentials
      ansible.builtin.assert:
        that:
          - patchmaster_api_url is defined
          - patchmaster_api_url | length > 0
          - patchmaster_bootstrap_token is defined
          - patchmaster_bootstrap_token | length > 0
        fail_msg: "Attach the PatchMaster AWX custom credential."
      no_log: true

    # =========================================================
    # 2. CHECK WHETHER V2 IS ALREADY INSTALLED
    # =========================================================

    - name: Check existing V2 systemd unit
      ansible.builtin.stat:
        path: "{{ patchmaster_v2_unit }}"
      register: patchmaster_v2_unit_stat

    - name: Set migration mode
      ansible.builtin.set_fact:
        patchmaster_v2_already_installed: >-
          {{ patchmaster_v2_unit_stat.stat.exists }}

    - name: Display migration mode
      ansible.builtin.debug:
        msg: >-
          {{
            'V2 already installed: will recover existing installation without re-enrollment.'
            if patchmaster_v2_already_installed
            else
            'V2 not installed: starting fresh V1 to V2 migration.'
          }}

    # =========================================================
    # 3. VALIDATE PACKAGE ON AWX
    # =========================================================

    - name: Check V2 Linux package files on AWX
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ patchmaster_package_dir }}/endpoint-agent-v2-linux-amd64"
        - "{{ patchmaster_package_dir }}/config.json"
        - "{{ patchmaster_package_dir }}/install-linux.sh"
      delegate_to: localhost
      become: false
      register: patchmaster_package_checks

    - name: Validate V2 package files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
        fail_msg: "Required V2 Linux package file is missing."
      loop: "{{ patchmaster_package_checks.results }}"

    - name: Validate V2 configuration JSON on AWX
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - "{{ patchmaster_package_dir }}/config.json"
      delegate_to: localhost
      become: false
      changed_when: false

    # =========================================================
    # 4. CREATE BACKUP DIRECTORY
    # =========================================================

    - name: Create migration backup directory
      ansible.builtin.file:
        path: "{{ patchmaster_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # =========================================================
    # 5. CHECK EXISTING V1 FILES
    # =========================================================

    - name: Check V1 state file
      ansible.builtin.stat:
        path: "{{ patchmaster_v1_state }}"
      register: patchmaster_v1_state_stat

    - name: Check V1 configuration
      ansible.builtin.stat:
        path: "{{ patchmaster_v1_config }}"
      register: patchmaster_v1_config_stat

    - name: Check V1 binary
      ansible.builtin.stat:
        path: "{{ patchmaster_v1_binary }}"
      register: patchmaster_v1_binary_stat

    - name: Check V1 systemd unit
      ansible.builtin.stat:
        path: "{{ patchmaster_v1_unit }}"
      register: patchmaster_v1_unit_stat

    # =========================================================
    # 6. BACKUP V1 INSTALLATION
    # Only during fresh migration
    # =========================================================

    - name: Back up V1 state
      ansible.builtin.copy:
        src: "{{ patchmaster_v1_state }}"
        dest: "{{ patchmaster_backup_dir }}/v1-state.json"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_state_stat.stat.exists

    - name: Back up V1 configuration
      ansible.builtin.copy:
        src: "{{ patchmaster_v1_config }}"
        dest: "{{ patchmaster_backup_dir }}/v1-config.json"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_config_stat.stat.exists

    - name: Back up V1 binary
      ansible.builtin.copy:
        src: "{{ patchmaster_v1_binary }}"
        dest: "{{ patchmaster_backup_dir }}/v1-endpoint-agent"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_binary_stat.stat.exists

    - name: Back up V1 systemd unit
      ansible.builtin.copy:
        src: "{{ patchmaster_v1_unit }}"
        dest: "{{ patchmaster_backup_dir }}/endpoint-agent.service"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_unit_stat.stat.exists

    # =========================================================
    # 7. STAGE V2 PACKAGE
    # =========================================================

    - name: Create V2 staging directory
      ansible.builtin.file:
        path: "{{ patchmaster_stage_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy V2 package to endpoint
      ansible.builtin.copy:
        src: "{{ patchmaster_package_dir }}/"
        dest: "{{ patchmaster_stage_dir }}/"
        owner: root
        group: root
        mode: preserve

    - name: Create V2 dist directory
      ansible.builtin.file:
        path: "{{ patchmaster_stage_dir }}/dist"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy V2 executable into expected dist directory
      ansible.builtin.copy:
        src: "{{ patchmaster_stage_dir }}/endpoint-agent-v2-linux-amd64"
        dest: "{{ patchmaster_stage_dir }}/dist/endpoint-agent-v2-linux-amd64"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    # =========================================================
    # 8. VERIFY STAGED PACKAGE
    # =========================================================

    - name: Check staged V2 executable
      ansible.builtin.stat:
        path: "{{ patchmaster_stage_dir }}/dist/endpoint-agent-v2-linux-amd64"
      register: patchmaster_staged_binary

    - name: Check staged V2 configuration
      ansible.builtin.stat:
        path: "{{ patchmaster_stage_dir }}/config.json"
      register: patchmaster_staged_config

    - name: Check staged V2 installer
      ansible.builtin.stat:
        path: "{{ patchmaster_stage_dir }}/install-linux.sh"
      register: patchmaster_staged_installer

    - name: Validate complete V2 staging
      ansible.builtin.assert:
        that:
          - patchmaster_staged_binary.stat.exists
          - patchmaster_staged_binary.stat.isreg
          - patchmaster_staged_binary.stat.executable
          - patchmaster_staged_config.stat.exists
          - patchmaster_staged_config.stat.isreg
          - patchmaster_staged_installer.stat.exists
          - patchmaster_staged_installer.stat.isreg
        fail_msg: "V2 package staging failed."

    - name: Validate staged V2 configuration JSON
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - "{{ patchmaster_stage_dir }}/config.json"
      changed_when: false

    # =========================================================
    # 9. STOP V1
    # =========================================================

    - name: Stop existing V1 agent
      ansible.builtin.systemd:
        name: "{{ patchmaster_v1_service }}"
        state: stopped
      failed_when: false
      when: not patchmaster_v2_already_installed

    - name: Disable existing V1 agent
      ansible.builtin.systemd:
        name: "{{ patchmaster_v1_service }}"
        enabled: false
      failed_when: false
      when: not patchmaster_v2_already_installed

    - name: Reload systemd before migration
      ansible.builtin.systemd:
        daemon_reload: true
      when: not patchmaster_v2_already_installed

    - name: Verify V1 is stopped
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ patchmaster_v1_service }}"
      register: patchmaster_v1_stop_check
      changed_when: false
      failed_when: false
      when: not patchmaster_v2_already_installed

    - name: Stop migration if V1 is still running
      ansible.builtin.assert:
        that:
          - patchmaster_v1_stop_check.stdout != "active"
        fail_msg: "V1 is still running. V2 migration cancelled."
      when: not patchmaster_v2_already_installed

    # =========================================================
    # 10. MOVE V1 CONFIGURATION AND STATE
    # =========================================================

    - name: Move old V1 state out of active location
      ansible.builtin.command:
        argv:
          - mv
          - "{{ patchmaster_v1_state }}"
          - "{{ patchmaster_backup_dir }}/v1-state-before-reenrollment.json"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_state_stat.stat.exists

    - name: Move old V1 configuration out of active location
      ansible.builtin.command:
        argv:
          - mv
          - "{{ patchmaster_v1_config }}"
          - "{{ patchmaster_backup_dir }}/v1-config-before-v2.json"
      when:
        - not patchmaster_v2_already_installed
        - patchmaster_v1_config_stat.stat.exists

    # =========================================================
    # 11. INSTALL AND ENROLL V2
    # Only during fresh migration
    # =========================================================

    - name: Install and enroll PatchMaster V2 agent
      ansible.builtin.command:
        argv:
          - bash
          - install-linux.sh
      args:
        chdir: "{{ patchmaster_stage_dir }}"
      environment:
        PATCHMASTER_API_URL: "{{ patchmaster_api_url }}"
        PATCHMASTER_BOOTSTRAP_TOKEN: "{{ patchmaster_bootstrap_token }}"
      register: patchmaster_v2_install_result
      no_log: true
      when: not patchmaster_v2_already_installed

    # =========================================================
    # 12. RELOAD SYSTEMD
    # =========================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # =========================================================
    # 13. ENABLE AND START V2
    # =========================================================

    - name: Enable V2 agent
      ansible.builtin.systemd:
        name: "{{ patchmaster_v2_service }}"
        enabled: true

    - name: Start V2 agent
      ansible.builtin.systemd:
        name: "{{ patchmaster_v2_service }}"
        state: started

    # =========================================================
    # 14. WAIT FOR V2 TO BECOME ACTIVE
    # =========================================================

    - name: Wait for V2 agent to become active
      block:

        - name: Check V2 service active state
          ansible.builtin.command:
            argv:
              - systemctl
              - is-active
              - "{{ patchmaster_v2_service }}"
          register: patchmaster_v2_status
          changed_when: false
          retries: 20
          delay: 3
          until: patchmaster_v2_status.stdout == "active"
          failed_when: patchmaster_v2_status.stdout != "active"

      rescue:

        - name: Collect V2 service status after startup failure
          ansible.builtin.command:
            argv:
              - systemctl
              - status
              - "{{ patchmaster_v2_service }}"
              - --no-pager
              - -l
          register: patchmaster_v2_failure_status
          changed_when: false
          failed_when: false

        - name: Collect V2 journal after startup failure
          ansible.builtin.command:
            argv:
              - journalctl
              - -u
              - "{{ patchmaster_v2_service }}"
              - -n
              - "100"
              - --no-pager
          register: patchmaster_v2_failure_journal
          changed_when: false
          failed_when: false

        - name: Display V2 startup diagnostics
          ansible.builtin.debug:
            msg:
              - "{{ patchmaster_v2_failure_status.stdout | default('No service status available') }}"
              - "{{ patchmaster_v2_failure_journal.stdout | default('No journal output available') }}"

        - name: Fail migration because V2 did not start
          ansible.builtin.fail:
            msg: >-
              V2 did not become active.
              Review the service status and journal output above.

    # =========================================================
    # 15. VERIFY V1 STATUS
    # =========================================================

    - name: Check V1 service enabled status
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ patchmaster_v1_service }}"
      register: patchmaster_v1_enabled_status
      changed_when: false
      failed_when: false

    # =========================================================
    # 16. VERIFY V2 PROCESS
    # =========================================================

    - name: Get V2 service details
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - "{{ patchmaster_v2_service }}"
          - --property=ActiveState
          - --property=SubState
          - --property=MainPID
      register: patchmaster_v2_details
      changed_when: false

    - name: Verify V2 is active
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in patchmaster_v2_details.stdout"
          - "'MainPID=0' not in patchmaster_v2_details.stdout"
        fail_msg: "V2 service is not running correctly."

    # =========================================================
    # 17. DISPLAY MIGRATION RESULT
    # =========================================================

    - name: Display migration result
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Migration mode: {{ 'Existing V2 recovery' if patchmaster_v2_already_installed else 'Fresh V1 to V2 migration' }}"
          - "V1 enabled status: {{ patchmaster_v1_enabled_status.stdout | default('unknown') }}"
          - "V2 status: {{ patchmaster_v2_details.stdout }}"
          - "V2 installation: {{ 'Existing installation preserved' if patchmaster_v2_already_installed else 'New installation completed' }}"
          - "Backup directory: {{ patchmaster_backup_dir }}"
