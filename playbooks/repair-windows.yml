---
- name: Repair PatchMaster Windows Agent Startup After Reboot
  hosts: DMDUVC31VAD0002, DMDUVC31VAD0001, DMDUVC19GAN0002, DMDUVC19GAN0001, DMDUVC118CHA001, DMDUVC18DEV0001, DMDUVC107ELU001, DMDUVC60ILA0001, DMDUVC20KAL0001, DMDUVC20KAL0002, DMDUVC21KAR0001, DMDUVC62MUD0001, DMDUVC62MUD0002, DMDUVC63ODD0002, DMDUVC108PAL001, DMDUVC108PAL002, DMDUVC64PAN0002, DMDUVC16RAM0001, DMDUVC68SAN0002, DMDUVC24SAT0002, DMDUVC26SIN0001, DMDUVC28KAL0002, DMDUVC29THI0002, DMDUVC71THU0002, DMDUVC30USI0001, DMDUVC30USI0002, DMDUVC73VADI002, DMDUVC74WAT0002
  gather_facts: false

  vars:
    ansible_connection: ssh
    ansible_shell_type: powershell
    ansible_ssh_transfer_method: scp
    ansible_scp_extra_args: "-O"

    agent_task_name: EndpointAgentV1
    agent_exe: 'C:\Program Files\EndpointAgent\endpoint-agent.exe'
    agent_config: 'C:\ProgramData\EndpointAgent\config.json'

  tasks:

    - name: Repair scheduled task startup and restart behavior
      ansible.builtin.raw: |
        $ErrorActionPreference = 'Stop'

        $taskName = '{{ agent_task_name }}'
        $exe = '{{ agent_exe }}'
        $config = '{{ agent_config }}'

        Write-Output '--- Checking existing agent files ---'

        if (-not (Test-Path -LiteralPath $exe)) {
            throw "Agent executable not found: $exe"
        }

        if (-not (Test-Path -LiteralPath $config)) {
            throw "Agent configuration not found: $config"
        }

        Write-Output 'Executable and configuration exist.'

        Write-Output '--- Checking existing scheduled task ---'

        $task = Get-ScheduledTask -TaskName $taskName `
            -ErrorAction SilentlyContinue

        if ($null -eq $task) {
            throw "Scheduled task '$taskName' does not exist. No replacement task was created because its original action cannot be verified."
        }

        if (@($task.Actions).Count -eq 0) {
            throw 'The existing scheduled task has no action. Repair stopped.'
        }

        Write-Output 'Existing task action:'
        $task.Actions | ForEach-Object {
            Write-Output ("Execute: " + $_.Execute)
            Write-Output ("Arguments: " + $_.Arguments)
            Write-Output ("WorkingDirectory: " + $_.WorkingDirectory)
        }

        Write-Output '--- Ensuring startup trigger ---'

        $triggers = @($task.Triggers)

        $hasStartupTrigger = @(
            $triggers | Where-Object {
                $_.CimClass.CimClassName -match 'BootTrigger'
            }
        ).Count -gt 0

        if (-not $hasStartupTrigger) {
            $triggers += New-ScheduledTaskTrigger -AtStartup
            Write-Output 'Added AtStartup trigger.'
        }
        else {
            Write-Output 'AtStartup trigger already exists.'
        }

        Write-Output '--- Applying startup repair ---'

        $principal = New-ScheduledTaskPrincipal `
            -UserId 'SYSTEM' `
            -LogonType ServiceAccount `
            -RunLevel Highest

        $settings = New-ScheduledTaskSettingsSet `
            -StartWhenAvailable `
            -RestartCount 3 `
            -RestartInterval (New-TimeSpan -Minutes 1) `
            -ExecutionTimeLimit ([TimeSpan]::Zero) `
            -MultipleInstances IgnoreNew

        Set-ScheduledTask `
            -TaskName $taskName `
            -Trigger $triggers `
            -Principal $principal `
            -Settings $settings | Out-Null

        Enable-ScheduledTask -TaskName $taskName | Out-Null

        Write-Output '--- Starting agent task ---'

        Start-ScheduledTask -TaskName $taskName
        Start-Sleep -Seconds 5

        $repairedTask = Get-ScheduledTask -TaskName $taskName
        $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName

        Write-Output ("Task state: " + $repairedTask.State)
        Write-Output ("Last run time: " + $taskInfo.LastRunTime)
        Write-Output ("Last task result: " + $taskInfo.LastTaskResult)

        Write-Output '--- Checking agent process ---'

        $processes = Get-CimInstance Win32_Process |
            Where-Object {
                $_.ExecutablePath -eq $exe -or
                $_.Name -eq 'endpoint-agent.exe'
            }

        if ($processes) {
            $processes | Select-Object ProcessId, Name, ExecutablePath |
                Format-Table -AutoSize | Out-String | Write-Output
        }
        else {
            Write-Output 'Agent process was not detected yet. Check the agent log and task result.'
        }

        Write-Output '--- Repair completed; review verification results above ---'
      register: agent_repair
      changed_when: "'Added AtStartup trigger.' in agent_repair.stdout or 'Repair completed' in agent_repair.stdout"

    - name: Display repair results
      ansible.builtin.debug:
        var: agent_repair.stdout_lines

